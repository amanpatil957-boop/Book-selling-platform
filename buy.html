<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Buy Books - Book Haven</title>

    <link rel="stylesheet" href="buy.css">

</head>


<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            📚 Book Haven
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="buy.html">
                Buy
            </a>

            <a href="sell.html">
                Sell
            </a>

        </div>

    </nav>


    <!-- Buy Page -->

    <main class="buy-page">

        <div class="page-heading">

            <h1>Available Books</h1>

            <p>
                Find your next favourite book.
            </p>

        </div>


        <!-- Books will appear here -->

        <div
            id="booksContainer"
            class="books-container">

        </div>


        <!-- No books message -->

        <div
            id="noBooks"
            class="no-books">

            <div class="empty-icon">
                📚
            </div>

            <h2>
                No books available
            </h2>

            <p>
                Be the first person to sell a book!
            </p>

            <a href="sell.html">
                Sell a Book
            </a>

        </div>

    </main>


    <script src="buy.js"></script>

</body>

</html>
