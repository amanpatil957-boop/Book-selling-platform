<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Haven - Book Selling Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>Welcome to Book Haven</h1>

            
<nav class="navbar">

    <div class="logo">
        📚 Book Haven
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="buy.html">
            Buy
        </a>

        <a href="sell.html">
            Sell
        </a>

        <a href="auth.html" id="authLink">
            Login
        </a>

    </div>

</nav>
            <p>
                Buy and sell books easily.
                Give your old books a new home and discover
                your next favourite read.
            </p>

            <button class="browse-btn" onclick="openBrowse()">
                Start Browsing
            </button>

        </div>

    </section>


    <!-- Browse Options -->
    <div id="browseOptions" class="browse-container">

        <div class="browse-box">

            <button class="close-btn" onclick="closeBrowse()">
                ×
            </button>

            <h2>What would you like to do?</h2>

            <div class="options">

                <div class="option-card">
                    <div class="option-icon">🛒</div>

                    <h3>Buy Books</h3>

                    <p>
                        Browse books listed by other sellers.
                    </p>

                    <button onclick="goToBuy()">
                        Buy Books
                    </button>
                </div>


                <div class="option-card">
                    <div class="option-icon">📖</div>

                    <h3>Sell Books</h3>

                    <p>
                        List your books and sell them to others.
                    </p>

                    <button onclick="goToSell()">
                        Sell Books
                    </button>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>
<script>
    updateNavbar();
    </script>
</body>
</html>
