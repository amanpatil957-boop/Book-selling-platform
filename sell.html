<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sell a Book - Book Haven</title>

    <link rel="stylesheet" href="sell.css">

</head>


<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            📚 Book Haven
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="buy.html">
                Buy
            </a>

            <a href="sell.html">
                Sell
            </a>

        </div>

    </nav>


    <!-- Sell Section -->

    <main class="sell-page">

        <div class="sell-container">

            <h1>Sell Your Book</h1>

            <p class="subtitle">
                Add your book details below.
            </p>


            <form id="bookForm">

                <!-- Image -->

                <div class="form-group">

                    <label for="bookImage">
                        Book Image
                    </label>

                    <input
                        type="file"
                        id="bookImage"
                        accept="image/*"
                        required
                    >

                </div>


                <!-- Book Name -->

                <div class="form-group">

                    <label for="bookName">
                        Book Name
                    </label>

                    <input
                        type="text"
                        id="bookName"
                        placeholder="Enter book name"
                        required
                    >

                </div>


                <!-- Price -->

                <div class="form-group">

                    <label for="bookPrice">
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="bookPrice"
                        placeholder="Enter price"
                        min="1"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Add Book

                </button>

            </form>


            <!-- Added books -->

            <div class="my-books">

                <h2>
                    Your Listed Books
                </h2>

                <div id="sellerBooks">

                </div>

            </div>

        </div>

    </main>


    <script src="sell.js"></script>

</body>

</html>
