```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login / Signup - Book Haven</title>

    <link rel="stylesheet" href="auth.css">

</head>


<body>

    <div class="auth-container">

        <div class="auth-box">

            <div class="logo">
                📚 Book Haven
            </div>


            <!-- Login -->

            <div id="loginSection">

                <h1>Welcome Back</h1>

                <p class="subtitle">
                    Login to continue
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label>Password</label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <button type="submit"
                            class="auth-btn">

                        Login

                    </button>

                </form>


                <p class="switch-text">

                    Don't have an account?

                    <button onclick="showSignup()">
                        Sign Up
                    </button>

                </p>

            </div>



            <!-- Signup -->

            <div id="signupSection"
                 style="display:none;">

                <h1>Create Account</h1>

                <p class="subtitle">
                    Join Book Haven today
                </p>


                <form id="signupForm">


                    <div class="form-group">

                        <label>Name</label>

                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label>Password</label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            minlength="6"
                            required>

                    </div>


                    <div class="form-group">

                        <label>Confirm Password</label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required>

                    </div>


                    <button type="submit"
                            class="auth-btn">

                        Create Account

                    </button>

                </form>


                <p class="switch-text">

                    Already have an account?

                    <button onclick="showLogin()">
                        Login
                    </button>

                </p>

            </div>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
```
